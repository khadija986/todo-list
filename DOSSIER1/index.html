<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>to-do list</title>
    <!-- Basic Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<!-- Filled Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
<!-- Brand Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

</head>
<body>
  <section id="title">
    <h1>MY TO-DO LIST</h1>
  </section><hr>
  <div class="content">
    <div class="left">
      <div id="mylist"><i class="bx bx-list-plus"></i>My Checklist:</div>
      <section>
        <input type="text" placeholder="note a task..." id="textarea"><button class="btn" type="submit">+</button>           </section>
      </section> 
      <div class="taches">
       </div>
    </div>
    <div class="right">
      <div id="mylist"><i class="bx bx-list-plus"></i>My finished tasks:</div>
      <div class="finished">
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
