<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>to-do list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
  
<body>
  <header>
  <section id="title">
    <h1><i data-lucide="book-heart"></i>MY TO-DO LIST</h1>
    <p>Little steps, big dreams</p>
  </section>
  </header>
  <div class="content">
    <div class="left">
      <div id="mylist1"><i data-lucide="list-checks"></i>My Checklist:</div>
      <section>
        <input type="text" placeholder="note a task..." id="textarea"><button class="btn" type="submit">+</button>           </section>
      </section> 
      <div class="taches">
       </div>
    </div>
    <div class="right">
      <div id="mylist2"><i data-lucide="circle-check"></i>My finished tasks:</div>
      <p id="tip"><em>Double click to delete one task</em></p>
      <div class="finished">
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
